name: DeathLogger
version: '${project.version}'
main: cc.synkdev.deathlogger.DeathLogger
api-version: '1.18'
authors: [ Synk ]
depend:
  - NexusCore
softdepend:
  - SkinsRestorer
  - PlaceholderAPI
permissions:
  deathlogger.teleport.all:
    description: Teleport to any death's location
    default: op
  deathlogger.teleport.self:
    description: Teleport to your own deaths' locations
    default: op
  deathlogger.coordinates.all:
    description: Teleport to any death's location
    default: op
  deathlogger.coordinates.self:
    description: Teleport to your own deaths' locations
    default: op
  deathlogger.inventory.view.all:
    description: View the inventory from any death
    default: op
  deathlogger.inventory.view.self:
    description: View the inventory from your own deaths
    default: op
  deathlogger.inventory.take:
    description: Give yourself the inventory from deaths
    default: op
  deathlogger.inventory.give:
    description: Give the players the inventory from their deaths
    default: op
  deathlogger.players:
    description: View the players menu
    default: true
  deathlogger.player:
    description: View the player (specific player's deaths) menu
    default: true
  deathlogger.refund:
    description: Refund a death to a player (with options)
    default: op
  deathlogger.reload:
    description: Reload the plugin
    default: op
  deathlogger.lastdeath.self:
    description: View the time since your last death
    default: true
  deathlogger.lastdeath.all:
    description: View the time since a player's last death
    default: true
  deathlogger.hunger.self:
    description: View the hunger status from your own deaths
    default: true
  deathlogger.hunger.all:
    description: View the hunger status from any player's deaths
    default: true
  deathlogger.exp.self:
    description: View the XP level from your own deaths
    default: true
  deathlogger.exp.all:
    description: View the XP level from any player's deaths
    default: true
  deathlogger.respawn.self:
    description: View the respawn location of your own deaths
    default: true
  deathlogger.respawn.all:
    description: View the respawn location of any player's deaths
    default: op
  deathlogger.respawn.teleport.all:
    description: Teleport to any player's respawn location
    default: op
  deathlogger.respawn.teleport.self:
    description: Teleport to your own respawn locations
    default: op
  deathlogger.respawn.coordinates.all:
    description: View the coordinates of any player's respawn location
    default: op
  deathlogger.respawn.coordinates.self:
    description: View the coordinates of your own deaths' respawn locations
    default: op